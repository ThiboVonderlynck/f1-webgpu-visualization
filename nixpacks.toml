# Nixpacks configuration for Railway
# This tells Railway to install both Node.js and Python

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "stdenv.cc.cc.lib"]

[phases.install]
cmds = [
  "cd backend/node && npm install",
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate && cd backend/python && pip install -r requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && cd backend/node && node server.mjs"
