# Nixpacks configuration for Railway
# This tells Railway to install both Node.js and Python

[phases.setup]
nixPkgs = ["nodejs_20", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "cd backend/node && npm install",
  "cd backend/python && pip install --user -r requirements.txt"
]

[start]
cmd = "cd backend/node && node server.mjs"
