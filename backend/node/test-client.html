<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Stream Test Client</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        h1 {
            color: #e10600;
        }

        .status {
            padding: 15px;
            background: #2a2a2a;
            border-radius: 8px;
            margin: 10px 0;
        }

        .connected {
            background: #1a4d1a;
        }

        .disconnected {
            background: #4d1a1a;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #e10600;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background: #b00500;
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            width: 200px;
        }

        .metadata {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .frame-info {
            font-family: 'Courier New', monospace;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #2a2a2a;
            border-radius: 5px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e10600, #ff3333);
            transition: width 0.1s linear;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-weight: bold;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }

        .stat-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #e10600;
        }
    </style>
</head>

<body>
    <h1>🏎️ F1 Telemetry Stream Test Client</h1>

    <div id="status" class="status disconnected">
        <strong>Status:</strong> <span id="status-text">Disconnected</span>
    </div>

    <div class="controls">
        <button id="connect-btn" onclick="connect()">Connect</button>
        <button id="start-btn" onclick="start()" disabled>▶ Start</button>
        <button id="pause-btn" onclick="pause()" disabled>⏸ Pause</button>
        <button id="stop-btn" onclick="stop()" disabled>⏹ Stop</button>

        <div class="speed-control">
            <label for="interval">Interval:</label>
            <select id="interval" onchange="updateInterval(this.value)" disabled>
                <option value="100">Every 100ms</option>
                <option value="250">Every 250ms</option>
                <option value="500">Every 500ms</option>
                <option value="1000" selected>Every 1s</option>
                <option value="2000">Every 2s</option>
                <option value="5000">Every 5s</option>
            </select>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progress" style="width: 0%">
            <span id="progress-text">0%</span>
        </div>
    </div>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">Current Frame</div>
            <div class="stat-value" id="current-frame">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Total Frames</div>
            <div class="stat-value" id="total-frames">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">FPS</div>
            <div class="stat-value" id="fps">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Drivers</div>
            <div class="stat-value" id="driver-count">0</div>
        </div>
    </div>

    <div class="metadata">
        <h3>Race Metadata</h3>
        <pre id="metadata">Not loaded</pre>
    </div>

    <div class="frame-info">
        <h3>Latest Frame Data</h3>
        <pre id="frame-data">No data yet</pre>
    </div>

    <script>
        let ws = null;
        let frameCount = 0;
        let lastFrameTime = Date.now();
        let fpsUpdateInterval = null;

        function connect() {
            if (ws) {
                ws.close();
            }

            setStatus('Connecting...', 'disconnected');
            ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                setStatus('Connected', 'connected');
                enableControls(true);
                startFPSCounter();
            };

            ws.onclose = () => {
                setStatus('Disconnected', 'disconnected');
                enableControls(false);
                stopFPSCounter();
            };

            ws.onerror = (error) => {
                setStatus('Error: ' + error.message, 'disconnected');
            };

            ws.onmessage = (event) => {
                const message = JSON.parse(event.data);
                handleMessage(message);
            };
        }

        function handleMessage(message) {
            switch (message.type) {
                case 'init':
                    document.getElementById('metadata').textContent = JSON.stringify(message.metadata, null, 2);
                    document.getElementById('total-frames').textContent = message.totalFrames.toLocaleString();
                    document.getElementById('current-frame').textContent = message.currentFrame.toLocaleString();
                    break;

                case 'frame':
                    frameCount++;
                    updateProgress(message.frameIndex, message.totalFrames);
                    document.getElementById('current-frame').textContent = message.frameIndex.toLocaleString();

                    // Show driver count
                    const driverCount = Object.keys(message.data.drivers || {}).length;
                    document.getElementById('driver-count').textContent = driverCount;

                    // Show frame data (truncated for readability)
                    const framePreview = {
                        frameIndex: message.frameIndex,
                        time: message.data.t,
                        driverCount: driverCount,
                        drivers: Object.keys(message.data.drivers || {}).slice(0, 5).reduce((acc, key) => {
                            acc[key] = message.data.drivers[key];
                            return acc;
                        }, {})
                    };
                    document.getElementById('frame-data').textContent = JSON.stringify(framePreview, null, 2);
                    break;

                case 'raceEnd':
                    setStatus('Race finished!', 'connected');
                    break;

                case 'error':
                    console.error('Server error:', message.message);
                    break;
            }
        }

        function setStatus(text, className) {
            const statusEl = document.getElementById('status');
            document.getElementById('status-text').textContent = text;
            statusEl.className = 'status ' + className;
        }

        function enableControls(enabled) {
            document.getElementById('connect-btn').disabled = enabled;
            document.getElementById('start-btn').disabled = !enabled;
            document.getElementById('pause-btn').disabled = !enabled;
            document.getElementById('stop-btn').disabled = !enabled;
            document.getElementById('interval').disabled = !enabled;
        }

        function start() {
            send({ command: 'start' });
        }

        function pause() {
            send({ command: 'pause' });
        }

        function stop() {
            send({ command: 'stop' });
            frameCount = 0;
            updateProgress(0, 1);
        }

        function updateInterval(value) {
            const interval = parseInt(value);
            send({ command: 'interval', value: interval });
        }

        function send(data) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify(data));
            }
        }

        function updateProgress(current, total) {
            const percent = (current / total) * 100;
            document.getElementById('progress').style.width = percent + '%';
            document.getElementById('progress-text').textContent = percent.toFixed(1) + '%';
        }

        function startFPSCounter() {
            frameCount = 0;
            lastFrameTime = Date.now();

            fpsUpdateInterval = setInterval(() => {
                const now = Date.now();
                const elapsed = (now - lastFrameTime) / 1000;
                const fps = elapsed > 0 ? frameCount / elapsed : 0;
                document.getElementById('fps').textContent = fps.toFixed(1);

                frameCount = 0;
                lastFrameTime = now;
            }, 1000);
        }

        function stopFPSCounter() {
            if (fpsUpdateInterval) {
                clearInterval(fpsUpdateInterval);
                fpsUpdateInterval = null;
            }
            document.getElementById('fps').textContent = '0';
        }

        // Auto-connect on page load
        window.onload = () => {
            // Uncomment to auto-connect:
            // connect();
        };
    </script>
</body>

</html>
